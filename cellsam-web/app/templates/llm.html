{% extends "base.html" %}

{% block title %}Cell LLM — CellLens{% endblock %}

{% block content %}

<div class="mb-4">
  <h4 class="font-weight-bold">세포 분석 AI</h4>
  <p class="text-muted">종양 세포 생물학 및 항암 치료 관련 질문을 입력하세요</p>
</div>

<!-- 대화 영역 -->
<div class="card shadow-sm mb-3">
  <div class="card-body p-0">
    <div id="chatHistory" style="height:450px; overflow-y:auto; padding:10px;">
      <div class="text-center text-muted small py-4">
        질문을 입력하면 AI가 답변합니다
      </div>
    </div>
  </div>
</div>

<!-- 로딩 -->
<div id="loadingSection" style="display:none;" class="text-center py-3">
  <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
  <span class="text-muted ml-2">답변 생성 중...</span>
</div>

<!-- 입력 영역 -->
<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex">
      <textarea id="userInput" class="form-control mr-2" rows="2" placeholder="질문을 입력하세요..." style="resize:none;"></textarea>
      <button id="sendBtn" class="btn btn-primary" style="white-space:nowrap;">전송</button>
    </div>
  </div>
</div>

{% endblock %}

{% block script %}
<script src="{{ url_for('static', filename='llm.js') }}"></script>
{% endblock %}
